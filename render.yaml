services:
  - type: web
    name: chika100
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
